<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>喜帖无名 | The Nameless Wedding Invitation</title>

  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>

<body>
  <main class="game">

    <!-- 游戏标题与重置按钮 -->
    <header class="game-header">
      <div>
        <h1>喜帖无名</h1>
        <p>The Nameless Wedding Invitation</p>
      </div>

      <button id="reset-button" type="button">
        重新开始
      </button>
    </header>

    <!-- 当前场景 -->
    <section
      class="scene-section"
      aria-labelledby="scene-title"
    >
      <h2 id="scene-title">宅院门厅</h2>

      <p id="scene-description">
        一封没有姓名的喜帖，将你引向这座旧宅。
        点击房间内的标记，调查物件并收集线索。
      </p>

      <div class="scene-stage">
        <img
          id="scene-image"
          src="images/screen1.jpg"
          alt="挂着红灯笼的宅院门厅，左侧柜台上放着收音机"
        >

        <!-- JavaScript 在此添加场景交互标记 -->
        <div id="hotspot-layer"></div>
      </div>

      <p
        id="game-message"
        role="status"
        aria-live="polite"
      >
        调查尚未开始。
      </p>
    </section>

    <!-- 房间切换按钮 -->
    <nav
      class="room-navigation"
      aria-label="选择房间"
    >
      <button type="button" data-room="hall">
        宅院门厅
      </button>

      <button type="button" data-room="wedding">
        无人喜堂
      </button>

      <button type="button" data-room="bedroom">
        新娘绣房
      </button>

      <button type="button" data-room="workshop">
        后院纸扎铺 🔒
      </button>

      <button type="button" data-room="corridor">
        回门长廊
      </button>
    </nav>

    <!-- 已收集证据 -->
    <section
      class="inventory-section"
      aria-labelledby="inventory-title"
    >
      <h2 id="inventory-title">
        已收集证据
        <span id="evidence-count">0</span>
      </h2>

      <p id="inventory-empty">
        还没有收集到证据。
      </p>

      <!-- JavaScript 在此添加证据按钮 -->
      <div id="inventory-list"></div>
    </section>

    <!-- 物件调查与结局弹窗 -->
    <dialog
      id="interaction-dialog"
      aria-labelledby="dialog-title"
    >
      <h2 id="dialog-title">调查物件</h2>

      <div id="dialog-content"></div>

      <div id="dialog-actions"></div>

      <button id="close-dialog" type="button">
        关闭
      </button>
    </dialog>

    <noscript>
      <p>
        请启用浏览器的 JavaScript，
        以进行搜证和房间探索。
      </p>
    </noscript>

  </main>
</body>
</html>
